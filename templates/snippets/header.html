<div class="py-2 bg-dark shadow-sm">

    <nav class="container d-flex justify-content-between align-items-center">


        <!-- ロゴ + ようこそ表示 -->
        <div class="d-flex align-items-center">

            <a class="text-white text-decoration-none fw-bold fs-5"
               href="{% url 'home' %}">

                🌍 Tripper

            </a>


            {% if user.is_authenticated %}

                <span class="text-white ms-3 d-flex align-items-center"
                      style="font-size: 0.9rem;">

                    ようこそ {{ user.username }} さん

                </span>

            {% endif %}


        </div>



        <!-- メニュー -->
        <div class="d-flex gap-4 align-items-center">


            {% if user.is_authenticated %}


                <a class="py-2 text-white text-decoration-none"
                   href="{% url 'home' %}">

                    Home

                </a>
                
                <a class="py-2 text-white text-decoration-none"
                   href="#">

                    みんなのTrip

                </a>



                <a class="py-2 text-white text-decoration-none"
                   href="#">

                    My Trip

                </a>



                <a class="py-2 text-white text-decoration-none"
                   href="#">

                    Trip作成

                </a>



                <a class="py-2 text-white text-decoration-none"
                   href="{% url 'profile' %}">

                    Profile

                </a>



                <form method="post"
                      action="{% url 'logout' %}"
                      class="d-inline">

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="border-0 bg-transparent text-white py-2">

                        ログアウト

                    </button>

                </form>



            {% else %}



                <a class="py-2 text-white text-decoration-none"
                   href="{% url 'login' %}">

                    ログイン

                </a>



                <a class="py-2 text-white text-decoration-none"
                   href="{% url 'signup' %}">

                    新規登録

                </a>



            {% endif %}


        </div>


    </nav>


</div>
