{% extends "base.html" %}


{% block title %}
パスワード再設定 | Tripper
{% endblock %}



{% block main %}


<div class="row justify-content-center">


    <div class="col-md-8 col-lg-6">


        <div class="card shadow-sm">


            <div class="card-body p-4">


                <h2 class="text-center mb-4">

                    パスワード再設定

                </h2>




                <p class="text-center mb-4">

                    登録しているメールアドレスを入力してください。<br>
                    パスワード再設定用のリンクを送信します。

                </p>





                {% if form.errors %}


                    <div class="alert alert-danger">

                        入力内容に誤りがあります。

                    </div>


                {% endif %}







                <form method="post">


                    {% csrf_token %}




                    <!-- メールアドレス -->

                    <div class="mb-4">


                        <label
                            for="id_email"
                            class="form-label">

                            メールアドレス

                        </label>




                        {{ form.email }}



                    </div>







                    <div class="d-grid">


                        <button
                            type="submit"
                            class="btn btn-primary">

                            再設定メールを送信

                        </button>


                    </div>




                </form>






                <div class="text-center mt-3">


                    <a href="{% url 'login' %}">

                        ログイン画面へ戻る

                    </a>


                </div>



            </div>


        </div>


    </div>


</div>


{% endblock %}
